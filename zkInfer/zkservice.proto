// ===== USER SUBMISSION & JOB STATUS =====

message SubmitJobRequest {
  string job_name = 1;
  string onnx_model_path = 2;
  string input_data_path = 3;
  string split_mode = 4;          // "none", "auto", or "fixed"
  int32 ops_per_chunk = 5;        // Only used if split_mode == "fixed"
}

message JobSubmissionResponse {
  string job_id = 1;
}

message JobIDRequest {
  string job_id = 1;
}

message JobStatusResponse {
  string job_id = 1;
  string status = 2;
}


// ===== WORKER INTERACTION =====

message WorkerIDRequest {
  string worker_id = 1;
}

// SubJobAssignment: Information needed by the worker to process a subjob.
message SubJobAssignment {
  string job_id = 1;
  string sub_model_name = 2;           // Consistent: Use "job_id" (not "global_job_id")
  string sub_job_id = 3;
  string model_path = 4;
  string input_json = 5;
  string s3_bucket = 6; // Only used if storage_backend == "s3"
  bool cache_setup = 7; // Whether to keep model artifacts (model files, etc.)
  bool overwrite_setup = 8; // Whether to overwrite existing files
  bool job_available = 9; // Indicates if the job is still available
}

// The result of a subjob proof computation.
message SubJobResult {
  string job_id = 1;
  string sub_job_id = 2;
  bytes proof = 3;
  bool success = 4;
}

// ===== HEARTBEAT & STATUS =====

message HeartbeatRequest {
  string worker_id = 1;
  string job_id = 2;
  string sub_job_id = 3;
  string status = 4;
  string message = 5;
}

message HeartbeatAck {
  bool success = 1;
}


message StatusAck {
  bool success = 1;
  string message = 2;
}

// ===== PERFORMANCE REPORTS =====

message PerfReport {
  string job_id = 1;
  string sub_job_id = 2;
  string worker_id = 3;
  string ezkl_json = 4;
  string halo2_json = 5;
}

// ===== SERVICE =====

service ZKJobService {

  // User API
  rpc SubmitJob (SubmitJobRequest) returns (JobSubmissionResponse);
  rpc GetJobStatus (JobIDRequest) returns (JobStatusResponse);
  //rpc GetJobSummary (JobIDRequest) returns (JobSummaryResponse);

  // Worker API
  rpc GetNextSubJob (WorkerIDRequest) returns (SubJobAssignment);
  rpc SubmitSubJobResult (SubJobResult) returns (StatusAck);

  // Heartbeats and Monitoring
  rpc SendHeartbeat (HeartbeatRequest) returns (HeartbeatAck);

  // Performance reporting
  rpc SendPerfReport (PerfReport) returns (StatusAck);

}
