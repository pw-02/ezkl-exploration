syntax = "proto3";

package zkservice;
//python -m grpc_tools.protoc -Igrpc_api --python_out=grpc_api --grpc_python_out=grpc_api grpc_api/zkservice.proto

// ===== ENUMS =====

enum SubJobStatus {
  UNKNOWN = 0;
  QUEUED = 1;
  STARTED = 2;
  GENERATING_SETTINGS = 3;
  CALIBRATING = 4;
  COMPILING = 5;
  SETTING_UP = 6;
  PROVING = 7;
  VERIFYING = 8;
  DONE = 9;
  FAILED = 10;
}

// ===== MESSAGES =====

message GlobalJobRequest {
  string job_name = 1;
  string onnx_model_path = 2;
  string input_data_path = 3;
  string split_mode = 4;          // "none", "auto", or "fixed"
  int32 ops_per_chunk = 5;        // Only used if split_mode == "fixed"
}

message JobIDResponse {
  string job_id = 1;
}

message JobIDRequest {
  string job_id = 1;
}

message JobStatusResponse {
  string job_id = 1;
  string status = 2;
}

message WorkerIDRequest {
  string worker_id = 1;
}

message SubJobResponse {
  string job_id = 1;
  string sub_job_id = 2;
  string model_path = 3;
  string input_path = 4;
  string output_dir = 5;
  bool available = 6;
}

message SubJobResult {
  string job_id = 1;
  string sub_job_id = 2;
  map<string, string> metrics = 3;
  bool success = 4;
}

message HeartbeatRequest {
  string worker_id = 1;
  string job_id = 2;
  string sub_job_id = 3;
  SubJobStatus status = 4;
  string message = 5;
}

message HeartbeatAck {
  bool success = 1;
}

message SubJobStatusInfo {
  string sub_job_id = 1;
  string worker_id = 2;
  SubJobStatus status = 3;
  float progress = 4;
  string message = 5;
  string last_seen = 6;
}

message SubJobStatusResponse {
  map<string, SubJobStatusInfo> statuses = 1;
}

message StatusAck {
  bool success = 1;
  string message = 2;
}

// ===== New: Job Summary for Live Status View =====

message JobSummaryResponse {
  string job_id = 1;
  string job_name = 2;
  string status = 3;
  int32 total_sub_jobs = 4;
  int32 completed_sub_jobs = 5;
  repeated SubJobStatusInfo sub_jobs = 6;
}

// ===== SERVICE =====

service ZKJobService {
  rpc SubmitGlobalJob (GlobalJobRequest) returns (JobIDResponse);
  rpc GetJobStatus (JobIDRequest) returns (JobStatusResponse);
  rpc GetJobSummary (JobIDRequest) returns (JobSummaryResponse);

  rpc FetchNextSubJob (WorkerIDRequest) returns (SubJobResponse);
  rpc SubmitSubJobResult (SubJobResult) returns (StatusAck);

  rpc SendHeartbeat (HeartbeatRequest) returns (HeartbeatAck);
  rpc ListActiveSubJobs (StatusAck) returns (SubJobStatusResponse);
}
