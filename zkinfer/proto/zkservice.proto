/*
python -m grpc_tools.protoc \
  -Izkinfer \
  --python_out=zkinfer/proto \
  --grpc_python_out=zkinfer/proto \
  zkinfer/proto/zkservice.proto
*/

syntax = "proto3";

package zkservice;

message InferenceRequest {
  string name = 1;
  string onnx_model_path = 2;
  string input_data_path = 3;
  string split_mode = 4;
  int32 ops_per_chunk = 5;
  bool simplify_model = 6;
  string input_shapes = 7;
}

message InferenceRequestAck {
  string request_id = 1;
}

message RequestStatusRequest {
  string request_id = 1;
}

message RequestStatusResponse {
  string request_id = 1;
  string status = 2;
  string message = 3;
  int32 total_jobs = 4;
  int32 queued_jobs = 5;
  int32 in_progress_jobs = 6;
  int32 completed_jobs = 7;
  int32 failed_jobs = 8;
}

message ArtifactRef {
  string backend = 1;
  string uri = 2;
  string sha256 = 3;
  uint64 size_bytes = 4;
  string s3_bucket = 5;
}

message NodeStatus {
  string node_id = 1;
  double memory_total_gb = 2;
  double memory_available_gb = 3;
  double cpu_total_cores = 4;
  double cpu_available_cores = 5;
  double cache_limit_gb = 6;
  double cache_used_gb = 7;
  repeated string active_job_ids = 8;
  repeated string cached_setup_keys = 9;
}

message JobLease {
  bool job_available = 1;
  string lease_id = 2;
  string request_id = 3;
  string job_id = 4;
  ArtifactRef model = 5;
  ArtifactRef input = 6;
  ArtifactRef setup_cache = 7;
  ArtifactRef output_prefix = 8;
  double predicted_duration_s = 9;
  double predicted_peak_memory_gb = 10;
  string setup_key = 11;
}

message NodeJobResult {
  string node_id = 1;
  string lease_id = 2;
  string request_id = 3;
  string job_id = 4;
  string status = 5;
  string message = 6;
  string perf_metrics_json = 7;
  ArtifactRef artifact_manifest = 8;
}

message StatusAck {
  bool ok = 1;
}

message NodeHeartbeat {
  string node_id = 1;
  repeated string active_job_ids = 2;
  string status = 3;
  string message = 4;
}

message HeartbeatAck {
  bool success = 1;
}

service ZKJobService {
  rpc SubmitInferenceRequest (InferenceRequest) returns (InferenceRequestAck);
  rpc GetRequestStatus (RequestStatusRequest) returns (RequestStatusResponse);
  rpc PollNode (NodeStatus) returns (JobLease);
  rpc SubmitJobResult (NodeJobResult) returns (StatusAck);
  rpc SendNodeHeartbeat (NodeHeartbeat) returns (HeartbeatAck);
}
