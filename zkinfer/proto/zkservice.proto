/*
python -m grpc_tools.protoc \
  -Izkinfer \
  --python_out=zkinfer/proto \
  --grpc_python_out=zkinfer/proto \
  zkinfer/proto/zkservice.proto
*/

syntax = "proto3";

package zkservice;

// ============================================================
// USER REQUESTS
// ============================================================

message InferenceRequest {
  string name = 1;

  string onnx_model_path = 2;
  string input_data_path = 3;

  // Model partitioning strategy.
  string split_mode = 4;     // none | single_ops | fixed
  int32 ops_per_chunk = 5;

  // Coordinator scheduling policy.
  string scheduler = 6;      // fifo | lpt

  // Optional ONNX simplification before splitting.
  bool simplify_model = 7;
  string input_shapes = 8;
}

message InferenceRequestAck {
  string request_id = 1;
}

// ============================================================
// REQUEST STATUS
// ============================================================

message RequestStatusRequest {
  string request_id = 1;
}

message RequestStatusResponse {
  string request_id = 1;

  // preparing | queued | in_progress | completed | failed | unknown
  string status = 2;

  string message = 3;

  int32 total_jobs = 4;
  int32 queued_jobs = 5;
  int32 in_progress_jobs = 6;
  int32 completed_jobs = 7;
  int32 failed_jobs = 8;
}

// ============================================================
// WORKER REQUESTS
// ============================================================

message WorkerRequest {
  string worker_id = 1;
}

message JobAssignment {
  bool job_available = 1;

  string request_id = 2;
  string job_id = 3;

  string model_path = 4;
  string input_path = 5;

  string cache_path = 6;
}

// ============================================================
// JOB RESULTS
// ============================================================

message JobResult {
  string worker_id = 1;
  string request_id = 2;
  string job_id = 3;

  bytes proof = 4;

  string status = 5;
  string message = 6;

  string perf_metrics_json = 7;
}

message StatusAck {
  bool ok = 1;
}

// ============================================================
// HEARTBEATS
// ============================================================

message HeartbeatRequest {
  string worker_id = 1;

  string request_id = 2;
  string job_id = 3;

  string status = 4;
  string message = 5;
}

message HeartbeatAck {
  bool success = 1;
}

// ============================================================
// SERVICE
// ============================================================

service ZKJobService {

  // User API
  rpc SubmitInferenceRequest (
    InferenceRequest
  ) returns (
    InferenceRequestAck
  );

  rpc GetRequestStatus (
    RequestStatusRequest
  ) returns (
    RequestStatusResponse
  );

  // Worker API
  rpc GetNextJob (
    WorkerRequest
  ) returns (
    JobAssignment
  );

  rpc SubmitJobResult (
    JobResult
  ) returns (
    StatusAck
  );

  // Monitoring
  rpc SendHeartbeat (
    HeartbeatRequest
  ) returns (
    HeartbeatAck
  );
}