/*
python -m grpc_tools.protoc \
  -Izkinfer \
  --python_out=zkinfer/proto \
  --grpc_python_out=zkinfer/proto \
  zkinfer/proto/zkservice.proto
*/

syntax = "proto3";

package zkservice;

message InferenceRequest {
  string name = 1;
  string onnx_model_path = 2;
  string input_data_path = 3;
  string split_mode = 4;
  int32 ops_per_chunk = 5;
  string scheduler = 6;
  bool simplify_model = 7;
  string input_shapes = 8;
}

message InferenceRequestAck {
  string request_id = 1;
}

message RequestStatusRequest {
  string request_id = 1;
}

message RequestStatusResponse {
  string request_id = 1;
  string status = 2;
  string message = 3;
  int32 total_jobs = 4;
  int32 queued_jobs = 5;
  int32 in_progress_jobs = 6;
  int32 completed_jobs = 7;
  int32 failed_jobs = 8;
}

message ArtifactRef {
  string backend = 1;     // filesystem | s3
  string uri = 2;         // filesystem path or S3 object key/prefix
  string sha256 = 3;      // optional for immutable file refs
  uint64 size_bytes = 4;  // optional for immutable file refs
  string s3_bucket = 5;   // empty for filesystem refs
}

message WorkerRequest {
  string worker_id = 1;
  double memory_budget_gb = 2;
  double reserved_memory_gb = 3;
  int32 free_slots = 4;
  repeated string cached_artifact_keys = 5;
}

message JobAssignment {
  bool job_available = 1;
  string request_id = 2;
  string job_id = 3;
  ArtifactRef model = 4;
  ArtifactRef input = 5;
  ArtifactRef setup_cache = 6;
  ArtifactRef output_prefix = 7;
  double predicted_duration_s = 8;
  double predicted_peak_memory_gb = 9;
  string artifact_key = 10;
}

message JobResult {
  string worker_id = 1;
  string request_id = 2;
  string job_id = 3;
  string status = 4;
  string message = 5;
  string perf_metrics_json = 6;
  ArtifactRef artifact_manifest = 7;
}

message StatusAck {
  bool ok = 1;
}

message HeartbeatRequest {
  string worker_id = 1;
  string request_id = 2;
  string job_id = 3;
  string status = 4;
  string message = 5;
}

message HeartbeatAck {
  bool success = 1;
}

service ZKJobService {
  rpc SubmitInferenceRequest (InferenceRequest) returns (InferenceRequestAck);
  rpc GetRequestStatus (RequestStatusRequest) returns (RequestStatusResponse);
  rpc GetNextJob (WorkerRequest) returns (JobAssignment);
  rpc SubmitJobResult (JobResult) returns (StatusAck);
  rpc SendHeartbeat (HeartbeatRequest) returns (HeartbeatAck);
}
