# config/config.yaml

defaults:
  - _self_
  - backend: ezkl
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

coordinator:
  host: localhost
  port: 50051
  grpc_thread_pool_size: 8
  grpc_max_message_mb: 128
  runs_dir: experiments/runs
  logs_dir: logs/coordinator
  state_store_enabled: true
  state_db_path: experiments/runs/coordinator_state.sqlite3

worker:
  worker_id: null
  runs_dir: experiments/runs
  logs_dir: logs/workers
  job_poll_interval_sec: 5
  resource_monitor_interval_sec: 3
  send_proofs_to_coordinator: false

  # Bounded local cache used for models, inputs, compiled circuits, and hot
  # proving keys. Set to 0 to disable eviction.
  local_cache_dir: storage/worker_cache
  local_cache_max_gb: 100

jobs:
  scheduler: lpt
  max_retries: 1
  # Skip model transfer and proving, but retain real input materialization,
  # shared-storage staging, scheduling, worker downloads, and JSON parsing.
  transfer_only: false

heartbeat:
  interval_sec: 15
  timeout_sec: 60

storage:
  # Keep the default runnable on a single machine. Override with
  # storage.backend=s3 storage.s3_bucket=<bucket> for distributed runs.
  backend: filesystem # filesystem | s3

  # Request-scoped scratch space for coordinator <-> worker communication.
  transfer_prefix: storage/transfer

  # Canonical content-addressed artifact store. Large immutable objects are
  # stored by SHA-256 here and exchanged through ArtifactRef metadata.
  artifact_prefix: storage/artifacts

  # Shared persistent setup cache namespace. Workers hydrate local hot caches
  # from this prefix and publish settings/compiled circuits/keys back to it.
  proving_cache_enabled: true
  proving_cache_prefix: storage/cache
  proving_cache_overwrite: false

  # Used only when backend=s3.
  s3_bucket: null
  s3_prefix: zkinfer

hydra:
  run:
    dir: .

  sweep:
    dir: .

  output_subdir: null

  job_logging:
    level: DISABLE

  hydra_logging:
    level: DISABLE
