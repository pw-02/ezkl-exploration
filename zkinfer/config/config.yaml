# config/config.yaml

defaults:
  - _self_
  - backend: ezkl
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

coordinator:
  host: localhost
  port: 50051
  grpc_thread_pool_size: 8
  grpc_max_message_mb: 128
  runs_dir: experiments/runs
  logs_dir: logs/coordinator
  state_store_enabled: true
  state_db_path: experiments/runs/coordinator_state.sqlite3

node:
  # One node supervisor runs per machine or cloud instance.
  node_id: null
  runs_dir: experiments/runs
  logs_dir: logs/nodes
  job_poll_interval_sec: 5
  # One-second sampling is a better default for distinguishing key generation
  # from proving in stage-level CPU/RSS traces.
  resource_monitor_interval_sec: 1

  # Purely local safety controls. The coordinator schedules from fresh resource
  # reports; it does not allocate abstract prover slots.
  local_concurrency_limit: 1
  max_heavy_phases: 1
  memory_reserve_gb: 8

  # Node-level cache shared by all local prover subprocesses. Set
  # local_cache_max_gb to 0 to disable eviction.
  local_cache_dir: storage/node_cache
  local_cache_max_gb: 100

jobs:
  scheduler: cache_aware
  max_retries: 1
  # Skip model transfer and proving while retaining input movement, scheduling,
  # node materialization, and JSON parsing for transfer-only experiments.
  transfer_only: false

verification:
  enabled: false
  srs_dir: srs
  require_split_chain: false
  write_request_manifest: true

heartbeat:
  interval_sec: 15
  timeout_sec: 60

storage:
  backend: filesystem # filesystem | s3
  transfer_prefix: storage/transfer
  artifact_prefix: storage/artifacts

  # Shared persistent setup cache. Nodes restore reusable setup files from this
  # location and publish newly generated settings/circuits/keys back to it.
  proving_cache_enabled: true
  proving_cache_prefix: storage/cache
  proving_cache_overwrite: false

  s3_bucket: null
  s3_prefix: zkinfer

hydra:
  run:
    dir: .
  sweep:
    dir: .
  output_subdir: null
  job_logging:
    level: DISABLE
  hydra_logging:
    level: DISABLE
