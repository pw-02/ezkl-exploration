# zkInfer runtime defaults

defaults:
  - _self_
  - backend: ezkl
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

coordinator:
  host: localhost
  port: 50051
  grpc_thread_pool_size: 8
  grpc_max_message_mb: 128
  runs_dir: experiments/runs
  logs_dir: logs/coordinator
  state_store_enabled: true
  state_db_path: experiments/runs/coordinator_state.sqlite3

node:
  # One NodeSupervisor runs per physical machine/cloud instance.
  node_id: null
  runs_dir: experiments/runs
  logs_dir: logs/nodes
  job_poll_interval_sec: 5

  # RSS/CPU sampling interval for resource_usage.csv. Exact EZKL and Halo2
  # transition durations are recorded separately and do not depend on this.
  # Use 0.25-0.5s for Section 3 characterization; 1.0s is a lighter default.
  resource_monitor_interval_sec: 1.0

  # Optional whole-job concurrency cap on this node.
  # 1    = safe default and the isolated Section 3 baseline.
  # N    = at most N active proof jobs on this node.
  # null = no fixed job-count cap. Use only for intentional concurrency runs,
  #        ideally with resource/phase admission enabled and established profiles.
  max_active_jobs: 1

  # Persistent local copies used by this node. The directory contains:
  #   objects/ : materialized model/input artifacts
  #   setup/   : local copies of reusable setup files
  local_cache_dir: storage/node/cache
  local_cache_max_gb: 50

  # Live phase reservations and node-local historical resource profiles.
  # This is runtime/scheduling state, not cached model data.
  runtime_state_dir: storage/node/runtime

  # Stage-level resource admission. Historical stage measurements are used when
  # available; otherwise the whole-job estimate is used conservatively.
  phase_admission:
    enabled: false
    memory_reserve_gb: 8
    cpu_budget_percent: 100
    profile_percentile: 0.90
    fallback_cpu_percent: 100

jobs:
  # Global coordinator scheduling policy:
  #   fifo           request-fair queue order
  #   lpt            longest predicted job first within the selected request
  #   cache_aware    prefer setup already resident on the polling node
  #   resource_aware use stage resource profiles plus cache locality
  scheduler: cache_aware
  max_retries: 1
  transfer_only: false

verification:
  enabled: false
  srs_dir: srs
  require_split_chain: false
  write_request_manifest: true

heartbeat:
  interval_sec: 15
  timeout_sec: 60

storage:
  backend: filesystem # filesystem | s3
  transfer_prefix: storage/transfer

  # Shared data-plane store. Models, materialized inputs, and published proof
  # outputs are referenced by metadata over gRPC rather than sent inline.
  artifact_prefix: storage/artifacts

  # Shared persistent setup cache. This is the warm/cold proving cache:
  # settings.json, network.compiled, pk.json, vk.json, and resource_profile.json.
  setup_cache_enabled: false
  setup_cache_prefix: storage/setup_cache
  setup_cache_overwrite: false

  s3_bucket: null
  s3_prefix: zkinfer

hydra:
  run:
    dir: .
  sweep:
    dir: .
  output_subdir: null
  job_logging:
    level: DISABLE
  hydra_logging:
    level: DISABLE
