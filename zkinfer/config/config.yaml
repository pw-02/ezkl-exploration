# zkInfer runtime defaults

defaults:
  - _self_
  - backend: ezkl
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

coordinator:
  host: localhost
  port: 50051
  grpc_thread_pool_size: 8
  grpc_max_message_mb: 128
  runs_dir: experiments/runs/requests
  logs_dir: logs/coordinator
  state_store_enabled: true
  state_db_path: experiments/runs/coordinator_state.sqlite3

  # Global request-fair scheduling policy for whole-job placement.
  # Stage-level memory admission remains node-local.
  # fifo | lpt | cache_aware | resource_aware
  scheduling_policy: cache_aware

node:
  # One NodeSupervisor runs per physical machine/cloud instance.
  node_id: null
  runs_dir: experiments/runs/requests
  logs_dir: logs/nodes
  job_poll_interval_sec: 5

  # RSS/CPU trace sampling interval. Exact stage transitions are timestamped
  # separately and do not depend on this interval.
  resource_sampling_interval_sec: 1.0

  # Optional hard whole-job concurrency cap.
  # 1    = safe sequential default
  # N    = fixed-concurrency baseline
  # null = no fixed cap; stage admission controls memory safety
  max_concurrent_jobs: 1

  local_cache:
    path: storage/node/cache
    max_gb: 5000

  # Live stage reservations and node-local historical profiles.
  runtime_state_dir: storage/node/runtime

  stage_admission:
    mode: stage # stage | whole_job; enabled controls both modes
    enabled: false
    # RAM intentionally left unavailable to proof workloads. This fixed reserve
    # is independent of historical predictions.
    memory_safety_reserve_gb: 8
    # Once enough observations exist, estimate stage memory from this percentile
    # of historical runs. Sparse history uses the observed maximum.
    history_percentile: 0.90

jobs:
  max_retries: 1

verification:
  enabled: false
  srs_dir: srs
  require_split_chain: false
  write_request_manifest: true

heartbeat:
  interval_sec: 15
  timeout_sec: 60

storage:
  backend: filesystem # filesystem | s3

  reusable_setup:
    # Reuse settings/circuit/PK/VK generated for the same setup identity.
    enabled: false
    path: storage/setup

  request_data:
    # Request-owned inputs, proofs, witnesses, and manifests.
    path: storage/requests

  resource_profiles:
    # Independent of compiled-circuit / key reuse. Null keeps profiles alongside setup.
    enabled: true
    path: null

  s3_bucket: null
  s3_prefix: zkinfer

hydra:
  run:
    dir: .
  sweep:
    dir: .
  output_subdir: null
  job_logging:
    level: DISABLE
  hydra_logging:
    level: DISABLE
