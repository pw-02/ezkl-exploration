# config/config.yaml

defaults:
  - _self_
  - backend: ezkl
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

coordinator:
  host: localhost
  port: 50051
  grpc_thread_pool_size: 4
  grpc_max_message_mb: 64

worker:
  worker_id: null
  job_poll_interval_sec: 5
  resource_monitor_interval_sec: 3
  send_proofs_to_coordinator: true

jobs:
  scheduler: fifo
  max_retries: 0

heartbeat:
  interval_sec: 5
  timeout_sec: 45

storage:
  # filesystem | s3
  type: filesystem

  # Used when type=filesystem
  root_dir: .

  # Per-run directory. Usually overridden by experiment launcher.
  run_dir: runs/default

  # Used when type=s3
  s3_bucket: null
  s3_prefix: zkinfer

hydra:
  run:
    dir: .

  sweep:
    dir: .

  output_subdir: null

  job_logging:
    level: DISABLE

  hydra_logging:
    level: DISABLE