defaults:
  - _self_
  - model: mnist_classifier  # mobilenet, mnist_gan, mnist_classifier, little_transformer, nano_gpt
  # - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
cache_setup_files: False  # Disable cache setup files
save_ezkl_settings: True  # Disable saving ezkl settings

hydra:
  run:
    dir: .  # Current directory or a specific directory where Ray Tune expects to find it
  sweep:
    dir: .  # Same as above
  output_subdir: null
  job_logging:
    level: DISABLE  # Disable job-specific logging
  hydra_logging:
    level: DISABLE  # Disable Hydra-specific logging
