defaults:
  - _self_
  - dispatcher: default
  - worker: default
  - model: mnist_classifier  
  # Options: mobilenetv2_050_Opset18, mnist_gan, little_transformer, nano_gpt, mnist_classifier,nano_gpt_4_layers_64_embd
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled
# Global control flags

storage_backend: s3 # Options: s3, local ... must be s3 for distributed workers 
s3_bucket: dzkml #null  # S3 bucket name - needed when workers are distributed across multiple machines or when using S3 as cache backend
cache_setup: true  # Whether to set up the cache directory and files
overwrite_cache: false  # Whether to overwrite existing files in the storage backend

# Dispatcher or worker launch mode (set in CLI)
run_mode: null  # Options: dispatcher, worker, submit

# Hydra output control
hydra:
  run:
    dir: .  # Current directory or a specific directory where Ray Tune expects to find it
  sweep:
    dir: .  # Same as above
  output_subdir: null
  job_logging:
    level: DISABLE  # Disable job-specific logging
  hydra_logging:
    level: DISABLE  # Disable Hydra-specific logging

#Launch Dispatcher
#python grpc_api/dispatcher_server.py --config-name=config run_mode=dispatcher

# Launch Worker:
#python grpc_api/worker_client.py --config-name=config run_mode=worker

#submit job to dispatcher
# python grpc_api/submit_job.py --config-name=config run_mode=submit