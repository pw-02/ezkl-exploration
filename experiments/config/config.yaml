defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# Example A/B comparison:
# python experiments/run_local_exp.py \
#   suite.workloads='[mnist_gan,mobilenet_v2]' \
#   node.phase_admission.enabled=true
# python experiments/run_local_exp.py \
#   suite.workloads='[mnist_gan,mobilenet_v2]' \
#   node.phase_admission.enabled=false

suite:
  workloads:
    - mnist_gan

execution:
  split_mode: fixed # none | fixed | auto
  ops_per_chunk: 1
  simplify_model: true

jobs:
  scheduler: lpt

# One local NodeSupervisor represents this machine. 
# With phase admission enabled, stage overlap is chosen
# from historical per-stage CPU/RSS demand and current node capacity.
node:
  node_id: local-node
  phase_admission:
    enabled: false
    memory_reserve_gb: 8
    cpu_budget_percent: 100
    profile_percentile: 0.90
    fallback_cpu_percent: 100
    emergency_process_limit: null

launch:
  coordinator_host: localhost
  coordinator_port: 50051
  coordinator_ready_timeout_sec: 30
  node_startup_delay_sec: 1
  poll_completion_interval_sec: 5

paths:
  runs_dir: experiments/runs

hydra:
  run:
    dir: .
  sweep:
    dir: .
  output_subdir: null
  job_logging:
    level: DISABLE
  hydra_logging:
    level: DISABLE
