defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

suite:
  workloads:
    - mnist_classifier
    - mnist_gan
    - mobilenet_v2
    - nano_gpt_4_layers_64_embd

execution:
  split_mode: none #none, fixed, auto
  ops_per_chunk: 1
  simplify_model: false

jobs:
  scheduler: fifo

launch:
  num_workers: 1
  coordinator_host: localhost
  coordinator_port: 50051
  coordinator_ready_timeout_sec: 30
  worker_startup_delay_sec: 5
  shutdown_when_done: true
  poll_completion_interval_sec: 5

paths:
  runs_dir: experiments/runs

hydra:
  run:
    dir: .
  sweep:
    dir: .
  output_subdir: null
  job_logging:
    level: DISABLE
  hydra_logging:
    level: DISABLE