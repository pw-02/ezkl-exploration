defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

suite:
  workloads:
    - nano_gpt_4_layers_64_embd #mnist_gan

execution:
  # false = one proof job for the whole model
  # true  = partition the model into consecutive groups of partition_size
  partitioning_enabled: true
  partition_size: 1
  simplify_model: true

coordinator:
  # fifo | lpt | cache_aware | resource_aware
  # fifo: request-fair queue order
  # lpt: longest predicted job first within the selected request
  # cache_aware: prefer setup already present on the polling node
  # resource_aware: reject jobs that cannot fit the machine, then use cache
  # locality and duration only as coarse placement preferences. Stage-level
  # admission remains node-local.
  scheduling_policy: lpt

node:
  node_id: local-node

  # Optional hard cap used for isolated runs and fixed-concurrency baselines.
  # Set null when stage admission should control concurrency.
  max_concurrent_jobs: 1

  # Sampling interval for resource_usage.csv. Stage-transition timestamps are
  # recorded separately and do not depend on this interval.
  resource_sampling_interval_sec: 0.25

  stage_admission:
    mode: stage # stage | whole_job; enabled controls both modes
    # false is appropriate for isolated Section 3 characterization runs.
    # Memory is the admission resource. The fixed reserve is independent of
    # historical predictions.
    enabled: false
    memory_safety_reserve_gb: 8
    history_percentile: 0.90

storage:
  reusable_setup:
    enabled: false
    path: storage/setup

  request_data:
    path: storage/requests

  local_cache:
    path: storage/node/cache
    max_gb: 50

output:
  # Copy proof/witness/setup artifacts into experiments/runs for debugging.
  # Traces, logs, manifests, and reports are always retained.
  keep_proof_artifacts: false

  # Keep canonical request-owned inputs/proofs under storage.request_data.path
  # after the experiment finishes. Reusable setup and experiment records are
  # never removed by this cleanup.
  keep_request_data: false

launch:
  coordinator_host: localhost
  coordinator_port: 50051
  coordinator_ready_timeout_sec: 30
  node_startup_delay_sec: 1
  poll_completion_interval_sec: 5

paths:
  runs_dir: experiments/runs

hydra:
  run:
    dir: .
  sweep:
    dir: .
  output_subdir: null
  job_logging:
    level: DISABLE
  hydra_logging:
    level: DISABLE
