defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

suite:
  workloads:
    - nano_gpt_4_layers_64_embd #mnist_gan

execution:
  partitioning:
    # whole_model    : one proof job for the complete model
    # single_operator: one proof job per meaningful ONNX operator
    # fixed_size     : consecutive meaningful operators grouped into fixed-size jobs
    mode: fixed_size
    # Used only when mode=fixed_size.
    operators_per_partition: 1
  simplify_model: true

jobs:
  # fifo | lpt | cache_aware | resource_aware
  # fifo: request-fair queue order
  # lpt: longest predicted job first within the selected request
  # cache_aware: prefer setup already present on the polling node
  # resource_aware: reject jobs that cannot fit the machine, then use cache
  # locality and duration only as coarse placement preferences. Stage-level
  # admission remains node-local.
  scheduler: lpt
  # Keep proof.pf/witness.json/vk.json/settings.json under experiments/runs.
  # false keeps only traces/logs/manifests there; canonical proof artifacts still
  # live under storage/requests until request-store cleanup runs.
  retain_run_artifacts: false

node:
  node_id: local-node

  # Section 3 isolated characterization should run one proof job at a time.
  # Set null only for experiments that intentionally study concurrent jobs;
  # resource/phase admission must then be configured for that experiment.
  max_active_jobs: 1

  # Sampling interval for resource_usage.csv. Stage transitions have exact
  # timestamps independent of this interval.
  resource_monitor_interval_sec: 0.25

  phase_admission:
    # false is appropriate for isolated Section 3 characterization runs.
    # Memory is the primary admission resource. The fixed reserve is retained
    # independently of historical predictions. CPU fallback is zero so unknown
    # CPU demand does not become a scheduling constraint by default.
    enabled: false
    memory_reserve_gb: 8
    cpu_budget_percent: 100
    profile_percentile: 0.90
    fallback_cpu_percent: 0

storage:
  # ONNX partitions and reusable settings/circuit/PK/VK share one setup identity.
  setup_dir: storage/setup
  reuse_setup: false
  requests_dir: storage/requests
  # Cleanup affects only request IDs submitted by this suite, never setup state.
  retain_requests_after_run: false

launch:
  coordinator_host: localhost
  coordinator_port: 50051
  coordinator_ready_timeout_sec: 30
  node_startup_delay_sec: 1
  poll_completion_interval_sec: 5

paths:
  runs_dir: experiments/runs

hydra:
  run:
    dir: .
  sweep:
    dir: .
  output_subdir: null
  job_logging:
    level: DISABLE
  hydra_logging:
    level: DISABLE